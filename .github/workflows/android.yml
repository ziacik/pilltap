name: Android
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
      - run: |
          if ! gradle :mobile:testDebugUnitTest :wear:testDebugUnitTest :mobile:lintDebug :wear:lintDebug :mobile:assembleDebug :wear:assembleDebug; then
            find . -path '*/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt' -print -exec cat {} \;
            exit 1
          fi
